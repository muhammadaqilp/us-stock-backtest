# All values are transparent HYPOTHESES, not optimized or validated parameters.
# Do not tune them against the final out-of-sample period.

[data]
source = "yfinance"            # yfinance Python library, auto_adjust=False (executable-style prices). The yfinance MCP is dividend-adjusted only, has no start/end, and is agent-side only: see README "MCP findings"
history_years = 5              # calendar years of daily history requested
cache_dir = "data/cache"
pause_seconds = 0.3            # politeness delay between per-ticker requests
max_stale_sessions = 1         # last bar may lag the expected last session by at most this many business days
max_missing_fraction = 0.02    # > this fraction of benchmark sessions missing inside a ticker's range => FAILED
min_history_rows = 260
max_abs_daily_move = 0.50      # |close/prev_close - 1| above this => warning (possible unadjusted split / bad tick)
scan_cache_max_age_hours = 12  # scan re-fetches cached data older than this

[universe]
min_price = 5.0
min_avg_dollar_volume = 20000000
sample_seed = 42               # deterministic sampling when --max-tickers is used
max_tickers = 150

[strategy]
max_atr_pct = 0.10
min_reward_risk = 2.0
min_score = 60.0
top_n = 10                    # max daily picks (a ceiling, never padded)
atr_stop_multiple = 2.0
atr_target_multiple = 4.0
max_entry_gap_atr = 0.0        # 0 = disabled (baseline: buy every next open). k>0: skip if next open > signal close + k*ATR14
entry_filter_tests = [0.25, 0.5, 1.0]  # compared in the backtest report; 0.5 was fixed in advance as the primary hypothesis
max_holding_days = 15          # sessions, entry session counts as session 1; stop/target may exit earlier (incl. before 5)
breakeven_trigger_atr = 0.0    # 0 = off. k>0: once high >= entry + k*ATR14, stop -> entry plus costs from the next session (pre-registered test B1 uses 1.0)
breakout_lookback = 20
breakout_volume_multiple = 1.5
pullback_ma_window = 20
pullback_tolerance = 0.01      # recent low must come within this fraction above the pullback MA
pullback_lookback = 5          # sessions in which the touch must have occurred
pullback_high_window = 10
pullback_min_depth = 0.03      # close must have been >= this far below the recent high during the pullback
rs_lookbacks = [20, 60]
rs_min_outperformance = 0.0    # stock return minus SPY return must exceed this over EVERY lookback
rs_high_window = 60
rs_max_distance_from_high = 0.05
general_relative_volume = 1.0
regime_sma = 0                 # 0 = off. N>0: no new entries unless SPY closed above its N-day SMA on the signal day (variant V1)
enabled_setups = ["breakout", "pullback", "relative_strength"]  # variant V3 drops "relative_strength"

[risk]
initial_capital = 1000.0
risk_per_trade = 0.005         # fraction of current equity
max_position_fraction = 0.20
max_positions = 5

[costs]
commission_bps_per_side = 5.0
slippage_bps_per_side = 10.0
cost_sensitivity_multipliers = [1.0, 2.0, 3.0]

[walkforward]
warmup_years = 2
test_months = 3
